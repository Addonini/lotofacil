name: Robô da Lotofácil

on:
  schedule:
    - cron: '30 0 * * 2,3,4,5,6' # Seg a Sex às 21:30 BRT
    - cron: '30 14 * * 0'        # Dom às 11:30 BRT
  workflow_dispatch:

jobs:
  atualizar_banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Rodar o Atualizador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python atualizador_lotofacil.py
